name: Gambling
version: '1.2.9'
main: org.jeffstein.gambling.Gambling
api-version: '1.21'
load: STARTUP
authors: [ Jeffstein ]
description: Official Minecraft Gambling Paper plugin
website: chudcraft.jeffstein.xyz
depend: [Vault]
commands:
  coinflip:
    description: Flip a coin for money!
    usage: /coinflip <amount>
    aliases: [cf]
  slots:
    description: Play the slot machine!
    usage: /slots <bet>
  blackjack:
    description: Play a game of blackjack!
    usage: /blackjack <bet>
    aliases: [bj]
  daily:
    description: Claim your daily reward.
    usage: /daily
  leaderboard:
    description: View the casino leaderboards.
    usage: /leaderboard
  jackpot:
    description: View the current jackpot.
    usage: /jackpot
  poker:
    description: Play poker with other players.
    usage: /poker <join|leave|bet|check|fold>
    aliases: [pk, pkr]
  baccarat:
    description: Play a game of baccarat!
    usage: /baccarat
    aliases: [bcc, bac]
  roulette:
    description: Play a game of roulette!
    usage: /roulette
    aliases: [rou, rlt]
  blackjackgui:
    description: Play a game of blackjack with a GUI!
    usage: /blackjackgui
    aliases: [bjg]
  keno:
    description: Play a game of keno!
    usage: /keno
  craps:
    description: Play a game of craps!
    usage: /craps
    aliases: [crp, cps]
  crash:
    description: Play the crash gambling game!
    usage: /crash
    aliases: [csh, crs]
  plinko:
    description: Play the Plinko ball drop game!
    usage: /plinko
    aliases: [plk, pln]
  wheel:
    description: Play the Wheel of Fortune game!
    usage: /wheel
    aliases: [wof, fortune]
  mines:
    description: Play the Mines game!
    usage: /mines
    aliases: [mine, mns]
  casino:
    description: Open the main casino lobby!
    usage: /casino
    aliases: [lobby, games, gamble]
