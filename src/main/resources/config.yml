# ═══════════════════════════════════════════════════════════════
#                    GAMBLING PLUGIN CONFIGURATION
# ═══════════════════════════════════════════════════════════════

# Casino Building System Configuration
casino-blocks:
  # Enable/disable the casino building system
  enabled: false
  
  # Visual Effects Settings
  visual-effects:
    # Enable floating holograms above casino blocks
    holograms:
      enabled: false
      height: 2.5  # Height above block (in blocks)
      floating-animation: true
      update-interval: 2  # Ticks between hologram updates
    
    # Enable particle effects around casino blocks
    particles:
      enabled: false
      update-interval: 3  # Ticks between particle updates
      density: 1.0  # Particle density multiplier (0.1 = sparse, 2.0 = dense)
    
    # Player win/loss effects
    player-effects:
      win-effects: false
      loss-effects: false
      effect-duration: 60  # Ticks (3 seconds)
  
  # Physical Interaction Settings
  physical-interactions:
    # Enable physical buttons/levers around casino blocks
    enabled: true
    
    # Auto-setup interactions when creating casino blocks
    auto-setup: true
    
    # Interaction range (how far from casino block to place controls)
    range: 2.0
    
    # Button/lever materials for different actions
    materials:
      hit-button: "ACACIA_BUTTON"
      stand-button: "CRIMSON_BUTTON"
      double-button: "BIRCH_BUTTON"
      spin-lever: "LEVER"
      cashout-block: "EMERALD_BLOCK"
      bet-plate: "STONE_PRESSURE_PLATE"
  
  # Default settings for new casino blocks
  defaults:
    min-bet: 10.0
    max-bet: 1000.0
    enabled: true
    
    # Default block types for each game
    block-types:
      blackjack: "ENCHANTING_TABLE"
      roulette: "CAULDRON"
      slots: "DISPENSER"
      poker: "CRAFTING_TABLE"
      baccarat: "CARTOGRAPHY_TABLE"
      craps: "SMOOTH_STONE_SLAB"
      keno: "LECTERN"
      crash: "REDSTONE_BLOCK"
      plinko: "HOPPER"
      wheel_of_fortune: "COMPASS"
      mines: "TNT"
      coinflip: "GOLD_INGOT"

# Game-Specific Settings
games:
  # Blackjack Configuration
  blackjack:
    # Enable physical hit/stand buttons
    physical-controls: true
    # Minimum bet for casino blocks
    min-bet: 5.0
    # Maximum bet for casino blocks
    max-bet: 10000.0
    # Allow double down via physical button
    allow-double-down: true
    # Allow split via physical button
    allow-split: false
  
  # Roulette Configuration
  roulette:
    physical-controls: true
    min-bet: 1.0
    max-bet: 5000.0
    # Auto-spin after bet placement
    auto-spin-delay: 100  # Ticks (5 seconds)
  
  # Slots Configuration
  slots:
    physical-controls: false  # Slots use GUI only
    min-bet: 1.0
    max-bet: 1000.0
  
  # Poker Configuration
  poker:
    physical-controls: false  # Poker uses GUI/commands
    min-bet: 10.0
    max-bet: 2000.0
  
  # Craps Configuration
  craps:
    physical-controls: true
    min-bet: 5.0
    max-bet: 3000.0
  
  # Crash Configuration
  crash:
    physical-controls: true
    min-bet: 10.0
    max-bet: 5000.0
    # Enable physical cash-out button
    physical-cashout: true
  
  # Plinko Configuration
  plinko:
    physical-controls: true
    min-bet: 5.0
    max-bet: 1000.0
    # Number of drop zones
    drop-zones: 9
  
  # Mines Configuration
  mines:
    physical-controls: true
    min-bet: 10.0
    max-bet: 2000.0
    # Grid size for physical interactions
    grid-size: 3  # 3x3 grid
  
  # Other games
  baccarat:
    physical-controls: false
    min-bet: 20.0
    max-bet: 8000.0
  
  keno:
    physical-controls: false
    min-bet: 5.0
    max-bet: 500.0
  
  wheel_of_fortune:
    physical-controls: false
    min-bet: 10.0
    max-bet: 2500.0
  
  coinflip:
    physical-controls: false
    min-bet: 1.0
    max-bet: 10000.0

# Permission Settings
permissions:
  # Require specific permissions for each game type
  per-game-permissions: true
  
  # Default permission for all casino blocks
  default-permission: "gambling.use"
  
  # Admin permission for managing casino blocks
  admin-permission: "gambling.admin.casinoblock"

# Economy Integration
economy:
  # Minimum balance required to use casino blocks
  minimum-balance: 0.0
  
  # Take a small fee for using casino blocks (0.0 = disabled)
  usage-fee: 0.0
  
  # Fee message
  fee-message: "&7A small usage fee of &a{fee} &7has been charged."

# Logging and Debugging
logging:
  # Log casino block creation/removal
  block-management: false
  
  # Log player interactions with casino blocks
  player-interactions: false
  
  # Log physical interactions (buttons/levers)
  physical-interactions: false
  
  # Debug mode (verbose logging)
  debug: false

# Performance Settings
performance:
  # Maximum number of casino blocks per world
  max-blocks-per-world: 100
  
  # Maximum number of casino blocks per player session
  max-active-sessions: 3
  
  # Cleanup inactive sessions after X minutes
  session-timeout: 30
  
  # Particle render distance (blocks)
  particle-distance: 32
  
  # Hologram render distance (blocks)
  hologram-distance: 64

# Messages and Localization
messages:
  # Casino block interaction messages
  block-created: "&a✓ Casino block created successfully!"
  block-removed: "&a✓ Casino block removed successfully!"
  block-not-found: "&cNo casino block found at this location."
  insufficient-funds: "&cYou need at least &a{min_bet} &cto play this game."
  no-permission: "&cYou don't have permission to use this casino game."
  game-disabled: "&cThis casino game is currently disabled."
  
  # Physical interaction messages
  hit-action: "&aHit! Drawing another card..."
  stand-action: "&eStand! Dealer's turn..."
  cashout-action: "&aCashed out successfully!"
  invalid-action: "&cInvalid action for current game state."
  
  # Visual effect messages
  hologram-format: 
    - "{game_name}"
    - "&f{block_name}"
    - "&aMin: {min_bet} | Max: {max_bet}"
    - "&eRight-click to play!"
  
  # Admin messages
  admin-reload: "&aConfiguration reloaded successfully!"
  admin-setup: "&aPhysical interactions set up for {game_type}!"

# Advanced Settings
advanced:
  # Save casino blocks to database instead of YAML (requires database setup)
  use-database: false
  
  # Database connection settings (if use-database is true)
  database:
    host: "localhost"
    port: 3306
    database: "gambling"
    username: "gambling_user"
    password: "password"
    table-prefix: "gambling_"
  
  # Integration with other plugins
  integrations:
    # WorldGuard integration (respect region flags)
    worldguard: false
    
    # GriefPrevention integration (respect claims)
    griefprevention: false
    
    # PlotSquared integration (respect plots)
    plotsquared: false
  
  # Backup settings
  backup:
    # Auto-backup casino blocks configuration
    enabled: false
    
    # Backup interval (hours)
    interval: 24
    
    # Keep X backup files
    keep-backups: 7
